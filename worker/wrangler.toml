name = "pdfchat-worker"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "pdfchat-chunks"

[[r2_buckets]]
binding = "PDF_BUCKET"
bucket_name = "pdfchat-pdfs"

[[queues.producers]]
binding = "DOC_QUEUE"
queue = "pdfchat-processing"

[[queues.consumers]]
queue = "pdfchat-processing"
max_batch_size = 1
max_batch_timeout = 10
max_retries = 3

[vars]
FIRESTORE_PROJECT_ID = "your-firebase-project-id"

# Secrets (do NOT put these here — set via `wrangler secret put`):
#   FIRESTORE_CLIENT_EMAIL
#   FIRESTORE_PRIVATE_KEY
